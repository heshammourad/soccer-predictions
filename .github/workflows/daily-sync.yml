name: Daily Soccer Predictor Sync

on:
  schedule:
    # Run once a day at 06:00 UTC (sweet spot for global game gaps and ratings updates)
    - cron: '0 6 * * *'
  # Allow manual trigger from the GitHub Actions tab
  workflow_dispatch:

jobs:
  sync-and-simulate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        # Version comes from the "packageManager" field in package.json
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      # node-tls-client@2.1.0 (unmaintained) downloads its native library from the
      # bogdanfinn/tls-client "latest" release at runtime. v1.16.0 (2026-09-02) renamed
      # every asset (tls-client-linux-ubuntu-amd64-<v>.so -> tls-client-xgo-<v>-linux-amd64.so),
      # so the built-in downloader can no longer find it. Pre-place a pinned copy at the
      # path it expects (os.tmpdir()/tls-client-x64.so) so it skips the broken download.
      - name: Prefetch tls-client native library
        run: |
          curl -fsSL -o /tmp/tls-client-x64.so \
            https://github.com/bogdanfinn/tls-client/releases/download/v1.16.0/tls-client-xgo-1.16.0-linux-amd64.so

      - name: Run Scraper & Simulation Engine
        run: pnpm exec tsx scripts/sync.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TMPDIR: /tmp
